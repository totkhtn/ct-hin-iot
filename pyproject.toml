[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-hin"
version = "1.0.0"
description = "Campaign-transductive heterogeneous information networks for cross-architecture IoT malware detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.0"]

[tool.setuptools]
packages = ["ct_hin"]
